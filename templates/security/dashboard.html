{% extends 'base.html' %}
{% block content %}
<div class="page-head"><h1>Security Dashboard</h1><a class="btn btn-primary" href="{{ url_for('security.scanner') }}"><i class="bi bi-qr-code-scan"></i> Scan QR</a></div>
<div class="stat-grid">
  {% for label, value in stats.items() %}<div class="stat-card"><span>{{ label|replace('_',' ')|title }}</span><strong>{{ value }}</strong></div>{% endfor %}
</div>
<div class="panel mt-3"><h2>Recent Visitors</h2>{% include 'partials/visitor_table.html' %}</div>
{% endblock %}
