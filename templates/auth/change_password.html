{% extends 'base.html' %}
{% block content %}
<div class="page-head"><h1>Change Password</h1></div>
<div class="panel">
  <form method="post" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-4"><input class="form-control" type="password" name="current_password" placeholder="Current password" required></div>
    <div class="col-md-4"><input class="form-control" type="password" name="new_password" placeholder="New password" required minlength="8"></div>
    <div class="col-md-4"><button class="btn btn-primary w-100">Update</button></div>
  </form>
</div>
{% endblock %}
